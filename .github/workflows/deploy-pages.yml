name: Deploy live demo to GitHub Pages

# Mirrors theraccoonbear/logician and theraccoonbear/exprforge: the site is
# published to the gh-pages branch, and Settings -> Pages -> Source stays
# "Deploy from a branch" (gh-pages, /root). Site assembly lives in
# scripts/build-site.mjs.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Assemble site
        run: node scripts/build-site.mjs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true
